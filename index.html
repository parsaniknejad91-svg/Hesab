<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حساب</title>
<style>
body{margin:0;padding:16px;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.container{max-width:620px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(15,23,42,.06)}h1{text-align:center}.tabs,.actions,.grid2,.filters,.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tab,.primary,.secondary,.ghost,.edit-btn,.delete-btn{border:0;border-radius:12px;min-height:46px;font-size:15px;font-weight:700}.tab{background:#e2e8f0}.tab.active{background:#0f172a;color:#fff}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.ghost{background:#f8fafc;border:1px solid #e2e8f0}.edit-btn{background:#fef3c7;color:#a16207;min-height:40px}.delete-btn{background:#fee2e2;color:#dc2626;min-height:40px}.hidden{display:none!important}label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}input,select{width:100%;height:48px;border:1px solid #e2e8f0;border-radius:12px;padding:0 12px;font-size:16px;box-sizing:border-box}.total{font-size:28px;font-weight:800;color:#15803d;text-align:center}.fx-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fx-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center}.filtered-summary{margin-top:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px;text-align:center;font-weight:700}.item{border:1px solid #e2e8f0;border-radius:14px;padding:13px;margin-top:10px}.item-top{display:flex;justify-content:space-between;gap:12px}.amount{font-size:20px;font-weight:800;color:#1d4ed8;direction:ltr}.fx-amount{color:#7c3aed}.meta{margin-top:8px;color:#64748b;font-size:14px;line-height:1.8}.list-head{display:flex;justify-content:space-between;align-items:center}.count{color:#64748b;font-size:13px}.empty{text-align:center;color:#64748b;padding:25px}.note{font-size:12px;color:#64748b;text-align:center;margin-top:8px}.section-title{display:flex;justify-content:space-between;align-items:center}.badge{font-size:12px;color:#64748b}@media(max-width:480px){.grid2,.filters,.actions{grid-template-columns:1fr}}
</style>
</head>
<body><main class="container">
<h1>حساب</h1>
<div class="tabs"><button class="tab active" id="tabRial">هزینه‌های اصلی</button><button class="tab" id="tabFx">هزینه‌های ارزی</button></div>
<section class="card" id="rialFormCard"><div class="section-title"><h2 id="rialFormTitle">ثبت هزینه</h2><span class="badge">تومان</span></div><label>تاریخ شمسی</label><input id="date" inputmode="numeric" placeholder="1405/05/07"><label>نام کارت یا بانک</label><input id="bank" placeholder="مثلاً بانک ملت"><label>مبلغ</label><input id="amount" inputmode="numeric" placeholder="مثلاً 12,500,000"><label>شرح</label><input id="description" placeholder="مثلاً خرید مصالح"><div class="actions"><button class="primary" id="saveBtn">ثبت تراکنش</button><button class="secondary hidden" id="cancelEditBtn">لغو ویرایش</button></div></section>
<section class="card hidden" id="fxFormCard"><div class="section-title"><h2 id="fxFormTitle">ثبت هزینه ارزی</h2><span class="badge">USD / AED / EUR</span></div><label>تاریخ شمسی</label><input id="fxDate" inputmode="numeric" placeholder="1405/05/07"><div class="grid2"><div><label>ارز</label><select id="fxCurrency"><option value="USD">دلار (USD)</option><option value="AED">درهم (AED)</option><option value="EUR">یورو (EUR)</option></select></div><div><label>مبلغ ارزی</label><input id="fxAmount" inputmode="decimal" placeholder="250.50"></div></div><label>کارت / بانک / حساب</label><input id="fxBank" placeholder="مثلاً حساب دبی"><label>شرح</label><input id="fxDescription" placeholder="مثلاً خرید قطعه"><div class="actions"><button class="primary" id="fxSaveBtn">ثبت هزینه ارزی</button><button class="secondary hidden" id="fxCancelEditBtn">لغو ویرایش</button></div></section>
<section class="card" id="rialSummary"><div class="note">جمع کل هزینه‌های اصلی</div><div class="total" id="total">0</div></section>
<section class="card hidden" id="fxSummary"><h2>جمع هزینه‌های ارزی</h2><div class="fx-totals"><div class="fx-box"><small>USD</small><strong id="usdTotal">0</strong></div><div class="fx-box"><small>AED</small><strong id="aedTotal">0</strong></div><div class="fx-box"><small>EUR</small><strong id="eurTotal">0</strong></div></div></section>
<section class="card"><h2>فیلتر و مرتب‌سازی</h2><div class="filters"><input id="bankSearch" placeholder="جستجو بر اساس نام بانک یا کارت"><input id="dateFrom" inputmode="numeric" placeholder="از تاریخ 1405/05/01"><input id="dateTo" inputmode="numeric" placeholder="تا تاریخ 1405/05/31"><select id="sortOrder"><option value="newest">جدیدترین تاریخ اول</option><option value="oldest">قدیمی‌ترین تاریخ اول</option></select><button class="ghost" id="clearFiltersBtn">پاک کردن فیلترها</button></div><div class="filtered-summary">جمع نتایج: <span id="filteredTotal">0</span></div></section>
<section class="card"><div class="list-head"><h2 id="listTitle">تراکنش‌ها</h2><span class="count" id="count">0 مورد</span></div><div id="list"></div></section>
<section class="card"><button class="secondary" id="exportBtn" style="width:100%">خروجی Excel</button><div class="note">خروجی شامل هزینه‌های اصلی و ارزی است.</div></section>
</main><script>
const STORAGE_KEY="hesab_transactions_v1",FX_STORAGE_KEY="hesab_fx_transactions_v1";let transactions=[],fxTransactions=[],editingId=null,editingFxId=null,currentMode="rial";const $=id=>document.getElementById(id);
function normalizeDigits(v){const p="۰۱۲۳۴۵۶۷۸۹",a="٠١٢٣٤٥٦٧٨٩";return String(v??"").replace(/[۰-۹]/g,d=>p.indexOf(d)).replace(/[٠-٩]/g,d=>a.indexOf(d))}function div(a,b){return~~(a/b)}function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}const gy2=gm>2?gy+1:gy;let days=365*gy+div(gy2+3,4)-div(gy2+99,100)+div(gy2+399,400)-80+gd+g[gm-1];jy+=33*div(days,12053);days%=12053;jy+=4*div(days,1461);days%=1461;if(days>365){jy+=div(days-1,365);days=(days-1)%365}const jm=days<186?1+div(days,31):7+div(days-186,30),jd=1+(days<186?days%31:(days-186)%30);return{jy,jm,jd}}function todayJ(){const d=new Date(),j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return`${j.jy}/${String(j.jm).padStart(2,"0")}/${String(j.jd).padStart(2,"0")}`}function normDate(v){const s=normalizeDigits(v).trim(),m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);return m?`${m[1]}/${String(m[2]).padStart(2,"0")}/${String(m[3]).padStart(2,"0")}`:s}function validDate(v){const m=normDate(v).match(/^(\d{4})\/(\d{2})\/(\d{2})$/);if(!m)return false;const mo=+m[2],d=+m[3];return mo>=1&&mo<=12&&d>=1&&((mo<=6&&d<=31)||(mo>=7&&mo<=11&&d<=30)||(mo===12&&d<=30))}function dateKey(v){return Number(normDate(v).replaceAll("/",""))||0}function fmt(n){return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})}function pR(v){const n=Number(normalizeDigits(v).replace(/[,\s٬،]/g,""));return Number.isFinite(n)?n:NaN}function pD(v){const n=Number(normalizeDigits(v).replace(/[,\s٬،]/g,""));return Number.isFinite(n)?n:NaN}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function saveAll(){localStorage.setItem(STORAGE_KEY,JSON.stringify(transactions));localStorage.setItem(FX_STORAGE_KEY,JSON.stringify(fxTransactions))}function loadAll(){try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"),f=JSON.parse(localStorage.getItem(FX_STORAGE_KEY)||"[]");transactions=Array.isArray(r)?r:[];fxTransactions=Array.isArray(f)?f:[]}catch(e){transactions=[];fxTransactions=[]}}
function resetR(){editingId=null;$("rialFormTitle").textContent="ثبت هزینه";$("saveBtn").textContent="ثبت تراکنش";$("cancelEditBtn").classList.add("hidden");$("date").value=todayJ();$("bank").value="";$("amount").value="";$("description").value=""}function saveR(){const date=normDate($("date").value),bank=$("bank").value.trim(),amount=pR($("amount").value),description=$("description").value.trim();if(!validDate(date))return alert("تاریخ شمسی معتبر وارد کنید.");if(!bank)return alert("نام بانک را وارد کنید.");if(!(amount>0))return alert("مبلغ معتبر وارد کنید.");if(editingId){const x=transactions.find(x=>x.id===editingId);Object.assign(x,{date,bank,amount,description})}else transactions.unshift({id:Date.now()+"_"+Math.random(),date,bank,amount,description});saveAll();resetR();render()}function editR(id){const x=transactions.find(x=>String(x.id)===String(id));if(!x)return;editingId=x.id;$("date").value=x.date;$("bank").value=x.bank;$("amount").value=fmt(x.amount);$("description").value=x.description||"";$("rialFormTitle").textContent="ویرایش هزینه";$("saveBtn").textContent="ذخیره ویرایش";$("cancelEditBtn").classList.remove("hidden");scrollTo(0,0)}
function resetF(){editingFxId=null;$("fxFormTitle").textContent="ثبت هزینه ارزی";$("fxSaveBtn").textContent="ثبت هزینه ارزی";$("fxCancelEditBtn").classList.add("hidden");$("fxDate").value=todayJ();$("fxCurrency").value="USD";$("fxAmount").value="";$("fxBank").value="";$("fxDescription").value=""}function saveF(){const date=normDate($("fxDate").value),currency=$("fxCurrency").value,amount=pD($("fxAmount").value),bank=$("fxBank").value.trim(),description=$("fxDescription").value.trim();if(!validDate(date))return alert("تاریخ شمسی معتبر وارد کنید.");if(!(amount>0))return alert("مبلغ ارزی معتبر وارد کنید.");if(editingFxId){const x=fxTransactions.find(x=>x.id===editingFxId);Object.assign(x,{date,currency,amount,bank,description})}else fxTransactions.unshift({id:"fx_"+Date.now()+"_"+Math.random(),date,currency,amount,bank,description});saveAll();resetF();render()}function editF(id){const x=fxTransactions.find(x=>String(x.id)===String(id));if(!x)return;editingFxId=x.id;$("fxDate").value=x.date;$("fxCurrency").value=x.currency;$("fxAmount").value=x.amount;$("fxBank").value=x.bank||"";$("fxDescription").value=x.description||"";$("fxFormTitle").textContent="ویرایش هزینه ارزی";$("fxSaveBtn").textContent="ذخیره ویرایش";$("fxCancelEditBtn").classList.remove("hidden");scrollTo(0,0)}
function filt(items){const q=$("bankSearch").value.trim().toLowerCase(),fr=$("dateFrom").value.trim(),to=$("dateTo").value.trim();let o=items.filter(x=>(!q||String(x.bank||"").toLowerCase().includes(q))&&(!fr||!validDate(fr)||dateKey(x.date)>=dateKey(fr))&&(!to||!validDate(to)||dateKey(x.date)<=dateKey(to)));o.sort((a,b)=>($("sortOrder").value==="oldest"?1:-1)*(dateKey(a.date)-dateKey(b.date)));return o}
function render(){const t=transactions.reduce((s,x)=>s+Number(x.amount||0),0);$("total").textContent=fmt(t);const ft={USD:0,AED:0,EUR:0};fxTransactions.forEach(x=>ft[x.currency]=(ft[x.currency]||0)+Number(x.amount||0));$("usdTotal").textContent=fmt(ft.USD);$("aedTotal").textContent=fmt(ft.AED);$("eurTotal").textContent=fmt(ft.EUR);const items=filt(currentMode==="rial"?transactions:fxTransactions);$("count").textContent=items.length+" مورد";$("listTitle").textContent=currentMode==="rial"?"تراکنش‌ها":"هزینه‌های ارزی";if(currentMode==="rial")$("filteredTotal").textContent=fmt(items.reduce((s,x)=>s+Number(x.amount||0),0));else{const z={USD:0,AED:0,EUR:0};items.forEach(x=>z[x.currency]+=Number(x.amount||0));$("filteredTotal").textContent=`USD ${fmt(z.USD)} | AED ${fmt(z.AED)} | EUR ${fmt(z.EUR)}`}if(!items.length){$("list").innerHTML='<div class="empty">موردی پیدا نشد.</div>';return}$("list").innerHTML=items.map(x=>currentMode==="rial"?`<article class="item"><div class="item-top"><strong>${esc(x.bank)}</strong><div class="amount">${fmt(x.amount)}</div></div><div class="meta">تاریخ: ${esc(x.date)}<br>شرح: ${esc(x.description||"—")}</div><div class="row-actions"><button class="edit-btn" data-a="er" data-id="${x.id}">ویرایش</button><button class="delete-btn" data-a="dr" data-id="${x.id}">حذف</button></div></article>`:`<article class="item"><div class="item-top"><strong>${esc(x.bank||"—")}</strong><div class="amount fx-amount">${fmt(x.amount)} ${esc(x.currency)}</div></div><div class="meta">تاریخ: ${esc(x.date)}<br>شرح: ${esc(x.description||"—")}</div><div class="row-actions"><button class="edit-btn" data-a="ef" data-id="${x.id}">ویرایش</button><button class="delete-btn" data-a="df" data-id="${x.id}">حذف</button></div></article>`).join("")}
function mode(m){currentMode=m;$("tabRial").classList.toggle("active",m==="rial");$("tabFx").classList.toggle("active",m==="fx");$("rialFormCard").classList.toggle("hidden",m!=="rial");$("fxFormCard").classList.toggle("hidden",m!=="fx");$("rialSummary").classList.toggle("hidden",m!=="rial");$("fxSummary").classList.toggle("hidden",m!=="fx");render()}
function csvE(v){return`"${String(v??"").replaceAll('"','""')}"`}function exportX(){const rows=[["نوع","تاریخ","کارت/بانک","مبلغ","ارز","شرح"],...transactions.map(x=>["اصلی",x.date,x.bank,x.amount,"TOMAN",x.description||""]),...fxTransactions.map(x=>["ارزی",x.date,x.bank||"",x.amount,x.currency,x.description||""])];const blob=new Blob(["\ufeff"+rows.map(r=>r.map(csvE).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="hesab.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function mask(el){el.addEventListener("input",()=>{let v=normalizeDigits(el.value).replace(/[^\d/]/g,"");if(!v.includes("/")){v=v.slice(0,8);if(v.length>4)v=v.slice(0,4)+"/"+v.slice(4);if(v.length>7)v=v.slice(0,7)+"/"+v.slice(7)}el.value=v.slice(0,10)})}["date","fxDate","dateFrom","dateTo"].forEach(id=>mask($(id)));$("amount").addEventListener("input",()=>{const n=normalizeDigits($("amount").value).replace(/\D/g,"");$("amount").value=n?Number(n).toLocaleString("en-US"):""});$("saveBtn").onclick=saveR;$("cancelEditBtn").onclick=resetR;$("fxSaveBtn").onclick=saveF;$("fxCancelEditBtn").onclick=resetF;$("tabRial").onclick=()=>mode("rial");$("tabFx").onclick=()=>mode("fx");["bankSearch","dateFrom","dateTo"].forEach(id=>$(id).oninput=render);$("sortOrder").onchange=render;$("clearFiltersBtn").onclick=()=>{$("bankSearch").value=$("dateFrom").value=$("dateTo").value="";$("sortOrder").value="newest";render()};$("list").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;const id=b.dataset.id,a=b.dataset.a;if(a==="er")editR(id);if(a==="ef")editF(id);if(a==="dr"&&confirm("حذف شود؟")){transactions=transactions.filter(x=>String(x.id)!==String(id));saveAll();render()}if(a==="df"&&confirm("حذف شود؟")){fxTransactions=fxTransactions.filter(x=>String(x.id)!==String(id));saveAll();render()}};$("exportBtn").onclick=exportX;$("date").value=$("fxDate").value=todayJ();loadAll();render();
</script></body></html>
