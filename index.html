<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>حساب</title>
  <style>
    :root{
      --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b;
      --border:#e2e8f0; --primary:#2563eb; --danger:#dc2626;
      --success:#15803d; --warning:#a16207; --soft:#eff6ff; --dark:#0f172a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;padding:16px;min-height:100vh;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    }
    .container{width:100%;max-width:620px;margin:0 auto}
    h1{text-align:center;font-size:26px;margin:10px 0 18px}
    h2{font-size:18px;margin:0}
    .card{
      background:var(--card);border:1px solid var(--border);border-radius:18px;
      padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(15,23,42,.06);
    }
    .section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
    .badge{font-size:12px;color:var(--muted)}
    label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
    input,select{
      width:100%;height:48px;border:1px solid var(--border);border-radius:12px;
      padding:0 12px;font-size:16px;background:#fff;outline:none;
    }
    input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .actions3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
    button{border:0;border-radius:12px;min-height:46px;font-size:15px;font-weight:700;cursor:pointer}
    .primary{background:var(--primary);color:#fff}
    .secondary{background:#e2e8f0;color:var(--text)}
    .danger{background:#fee2e2;color:var(--danger)}
    .ghost{background:#f8fafc;color:var(--text);border:1px solid var(--border)}
    .dark{background:var(--dark);color:#fff}
    .summary{text-align:center}
    .summary small{color:var(--muted);display:block;margin-bottom:6px}
    .total{font-size:28px;font-weight:800;color:var(--success);word-break:break-word}
    .period-label{
      display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;
      background:#ecfdf5;color:#166534;font-size:12px;font-weight:700;
    }
    .fx-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .fx-box{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
    .fx-box small{display:block;color:var(--muted);margin-bottom:4px}
    .fx-box strong{font-size:17px}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .filters .full{grid-column:1/-1}
    .filtered-summary{
      margin-top:10px;background:var(--soft);border:1px solid #bfdbfe;border-radius:12px;
      padding:12px;text-align:center;color:#1e3a8a;font-weight:700;
    }
    .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .count{color:var(--muted);font-size:13px}
    .item{border:1px solid var(--border);border-radius:14px;padding:13px;margin-top:10px;background:#fff}
    .item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .amount{font-size:20px;font-weight:800;color:#1d4ed8;direction:ltr;text-align:left}
    .fx-amount{color:#7c3aed}
    .meta{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.8;overflow-wrap:anywhere}
    .row-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .edit-btn{background:#fef3c7;color:var(--warning);min-height:40px;font-size:14px}
    .delete-btn{background:#fee2e2;color:var(--danger);min-height:40px;font-size:14px}
    .empty{text-align:center;color:var(--muted);padding:28px 8px}
    .note{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin-top:10px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .tab{background:#e2e8f0;color:var(--text)}
    .tab.active{background:#0f172a;color:#fff}
    .hidden{display:none!important}
    @media(max-width:480px){
      .grid2,.filters,.actions,.actions3{grid-template-columns:1fr}
      .fx-totals{grid-template-columns:1fr 1fr 1fr}
      .total{font-size:24px}
      .filters .full{grid-column:auto}
    }
  </style>
</head>
<body>
<main class="container">
  <h1>حساب</h1>

  <div class="tabs">
    <button class="tab active" id="tabRial" type="button">هزینه‌های اصلی</button>
    <button class="tab" id="tabFx" type="button">هزینه‌های ارزی</button>
  </div>

  <section class="card" id="rialFormCard">
    <div class="section-title">
      <h2 id="rialFormTitle">ثبت هزینه</h2>
      <span class="badge">تومان</span>
    </div>

    <label for="date">تاریخ شمسی</label>
    <input id="date" type="text" inputmode="numeric" placeholder="1405/05/07" autocomplete="off" />

    <label for="bank">نام کارت یا بانک</label>
    <input id="bank" type="text" placeholder="مثلاً بانک ملت" autocomplete="off" />

    <label for="amount">مبلغ</label>
    <input id="amount" type="text" inputmode="numeric" placeholder="مثلاً 12,500,000" autocomplete="off" />

    <label for="description">شرح</label>
    <input id="description" type="text" placeholder="مثلاً خرید مصالح" autocomplete="off" />

    <div class="actions">
      <button class="primary" id="saveBtn" type="button">ثبت تراکنش</button>
      <button class="secondary hidden" id="cancelEditBtn" type="button">لغو ویرایش</button>
    </div>
  </section>

  <section class="card hidden" id="fxFormCard">
    <div class="section-title">
      <h2 id="fxFormTitle">ثبت هزینه ارزی</h2>
      <span class="badge">USD / AED / EUR</span>
    </div>

    <label for="fxDate">تاریخ شمسی</label>
    <input id="fxDate" type="text" inputmode="numeric" placeholder="1405/05/07" autocomplete="off" />

    <div class="grid2">
      <div>
        <label for="fxCurrency">ارز</label>
        <select id="fxCurrency">
          <option value="USD">دلار (USD)</option>
          <option value="AED">درهم (AED)</option>
          <option value="EUR">یورو (EUR)</option>
        </select>
      </div>
      <div>
        <label for="fxAmount">مبلغ ارزی</label>
        <input id="fxAmount" type="text" inputmode="decimal" placeholder="مثلاً 250.50" autocomplete="off" />
      </div>
    </div>

    <label for="fxBank">کارت / بانک / حساب</label>
    <input id="fxBank" type="text" placeholder="مثلاً حساب دبی" autocomplete="off" />

    <label for="fxDescription">شرح</label>
    <input id="fxDescription" type="text" placeholder="مثلاً خرید قطعه" autocomplete="off" />

    <div class="actions">
      <button class="primary" id="fxSaveBtn" type="button">ثبت هزینه ارزی</button>
      <button class="secondary hidden" id="fxCancelEditBtn" type="button">لغو ویرایش</button>
    </div>
  </section>

  <section class="card summary" id="rialSummary">
    <small id="totalLabel">جمع کل دوره جاری</small>
    <div class="total" id="total">0</div>
    <div class="period-label" id="periodInfo">دوره جاری</div>

    <div class="actions3">
      <button class="dark" id="newPeriodBtn" type="button">شروع دوره جدید</button>
      <button class="secondary" id="showAllBtn" type="button">نمایش همه دوره‌ها</button>
      <button class="ghost hidden" id="showCurrentBtn" type="button">نمایش دوره جاری</button>
    </div>
  </section>

  <section class="card hidden" id="fxSummary">
    <div class="section-title"><h2>جمع هزینه‌های ارزی</h2></div>
    <div class="fx-totals">
      <div class="fx-box"><small>USD</small><strong id="usdTotal">0</strong></div>
      <div class="fx-box"><small>AED</small><strong id="aedTotal">0</strong></div>
      <div class="fx-box"><small>EUR</small><strong id="eurTotal">0</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="section-title"><h2>فیلتر و مرتب‌سازی</h2></div>

    <div class="filters">
      <input id="bankSearch" class="full" type="text" placeholder="جستجو بر اساس نام بانک یا کارت" autocomplete="off" />
      <input id="dateFrom" type="text" inputmode="numeric" placeholder="از تاریخ 1405/05/01" autocomplete="off" />
      <input id="dateTo" type="text" inputmode="numeric" placeholder="تا تاریخ 1405/05/31" autocomplete="off" />
      <select id="sortOrder">
        <option value="newest">جدیدترین تاریخ اول</option>
        <option value="oldest">قدیمی‌ترین تاریخ اول</option>
      </select>
      <button class="ghost" id="clearFiltersBtn" type="button">پاک کردن فیلترها</button>
    </div>

    <div class="filtered-summary">
      جمع نتایج:
      <span id="filteredTotal">0</span>
    </div>

    <button class="secondary" id="exportBtn" type="button" style="width:100%;margin-top:10px">خروجی Excel</button>
    <div class="note">اگر فیلتر فعال باشد فقط نتایج فیلترشده خروجی می‌گیرند؛ اگر فیلتر خالی باشد همه دوره‌ها خروجی می‌شوند.</div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2 id="listTitle">تراکنش‌ها</h2>
      <span class="count" id="count">0 مورد</span>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
  const STORAGE_KEY = "hesab_transactions_v1";
  const FX_STORAGE_KEY = "hesab_fx_transactions_v1";
  const PERIOD_KEY = "hesab_period_start_v1";

  let transactions = [];
  let fxTransactions = [];
  let editingId = null;
  let editingFxId = null;
  let currentMode = "rial";
  let showAllPeriods = false;
  let currentPeriodStart = null;

  const $ = id => document.getElementById(id);

  const dateInput = $("date"), bankInput = $("bank"), amountInput = $("amount"),
        descriptionInput = $("description"), saveBtn = $("saveBtn"), cancelEditBtn = $("cancelEditBtn");

  const fxDateInput = $("fxDate"), fxCurrencyInput = $("fxCurrency"), fxAmountInput = $("fxAmount"),
        fxBankInput = $("fxBank"), fxDescriptionInput = $("fxDescription"), fxSaveBtn = $("fxSaveBtn"),
        fxCancelEditBtn = $("fxCancelEditBtn");

  const bankSearchInput = $("bankSearch"), dateFromInput = $("dateFrom"), dateToInput = $("dateTo"),
        sortOrderInput = $("sortOrder"), filteredTotalEl = $("filteredTotal");

  function normalizeDigits(value) {
    const p="۰۱۲۳۴۵۶۷۸۹", a="٠١٢٣٤٥٦٧٨٩";
    return String(value??"").replace(/[۰-۹]/g,d=>p.indexOf(d)).replace(/[٠-٩]/g,d=>a.indexOf(d));
  }

  function div(a,b){return ~~(a/b)}

  function gregorianToJalali(gy,gm,gd){
    const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
    let jy;
    if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
    const gy2=gm>2?gy+1:gy;
    let days=365*gy+div(gy2+3,4)-div(gy2+99,100)+div(gy2+399,400)-80+gd+gdm[gm-1];
    jy+=33*div(days,12053);days%=12053;
    jy+=4*div(days,1461);days%=1461;
    if(days>365){jy+=div(days-1,365);days=(days-1)%365}
    const jm=days<186?1+div(days,31):7+div(days-186,30);
    const jd=1+(days<186?days%31:(days-186)%30);
    return{jy,jm,jd};
  }

  function todayJalali(){
    const d=new Date(),j=gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
    return `${j.jy}/${String(j.jm).padStart(2,"0")}/${String(j.jd).padStart(2,"0")}`;
  }

  function normalizeJalali(value){
    const v=normalizeDigits(value).trim(),m=v.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if(!m)return v;
    return `${m[1]}/${String(m[2]).padStart(2,"0")}/${String(m[3]).padStart(2,"0")}`;
  }

  function isValidJalaliDate(value){
    const v=normalizeJalali(value),m=v.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
    if(!m)return false;
    const y=+m[1],mo=+m[2],d=+m[3];
    if(y<1200||y>1600||mo<1||mo>12||d<1)return false;
    if(mo<=6&&d>31)return false;
    if(mo>=7&&mo<=11&&d>30)return false;
    if(mo===12&&d>30)return false;
    return true;
  }

  function dateKey(v){return Number(normalizeJalali(v).replaceAll("/",""))||0}
  function formatNumber(n){return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})}
  function parseRial(v){const n=Number(normalizeDigits(v).replace(/[,\s٬،]/g,""));return Number.isFinite(n)?n:NaN}
  function parseDecimal(v){const n=Number(normalizeDigits(v).replace(/[,٬،\s]/g,""));return Number.isFinite(n)?n:NaN}

  function saveAll(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(transactions));
      localStorage.setItem(FX_STORAGE_KEY,JSON.stringify(fxTransactions));
      localStorage.setItem(PERIOD_KEY,currentPeriodStart||"");
      return true;
    }catch(e){alert("ذخیره‌سازی مرورگر در دسترس نیست.");return false}
  }

  function loadAll(){
    try{
      const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
      const f=JSON.parse(localStorage.getItem(FX_STORAGE_KEY)||"[]");
      transactions=Array.isArray(r)?r:[];
      fxTransactions=Array.isArray(f)?f:[];
      currentPeriodStart=localStorage.getItem(PERIOD_KEY)||null;
      if(!currentPeriodStart) currentPeriodStart = transactions.length ? transactions[transactions.length-1].date : todayJalali();
    }catch(e){
      transactions=[];fxTransactions=[];currentPeriodStart=todayJalali();
    }
  }

  function escapeHtml(v){
    return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function addOrEditRial(){
    const date=normalizeJalali(dateInput.value),bank=bankInput.value.trim(),
          amount=parseRial(amountInput.value),description=descriptionInput.value.trim();
    if(!isValidJalaliDate(date)){alert("تاریخ شمسی را به شکل 1405/05/07 وارد کنید.");return}
    if(!bank){alert("نام کارت یا بانک را وارد کنید.");return}
    if(!Number.isFinite(amount)||amount<=0){alert("مبلغ معتبر وارد کنید.");return}

    if(editingId){
      const item=transactions.find(x=>x.id===editingId);
      if(item){item.date=date;item.bank=bank;item.amount=amount;item.description=description}
    }else{
      transactions.unshift({id:Date.now().toString()+Math.random().toString(16).slice(2),
        date,bank,amount,description,createdAt:new Date().toISOString()});
    }
    saveAll();resetRialForm();render();
  }

  function resetRialForm(){
    editingId=null;$("rialFormTitle").textContent="ثبت هزینه";saveBtn.textContent="ثبت تراکنش";
    cancelEditBtn.classList.add("hidden");dateInput.value=todayJalali();bankInput.value="";
    amountInput.value="";descriptionInput.value="";
  }

  function editRial(id){
    const item=transactions.find(x=>x.id===id);if(!item)return;
    editingId=id;dateInput.value=item.date||todayJalali();bankInput.value=item.bank||"";
    amountInput.value=formatNumber(item.amount);descriptionInput.value=item.description||"";
    $("rialFormTitle").textContent="ویرایش هزینه";saveBtn.textContent="ذخیره ویرایش";
    cancelEditBtn.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
  }

  function addOrEditFx(){
    const date=normalizeJalali(fxDateInput.value),currency=fxCurrencyInput.value,
          amount=parseDecimal(fxAmountInput.value),bank=fxBankInput.value.trim(),
          description=fxDescriptionInput.value.trim();
    if(!isValidJalaliDate(date)){alert("تاریخ شمسی را به شکل 1405/05/07 وارد کنید.");return}
    if(!Number.isFinite(amount)||amount<=0){alert("مبلغ ارزی معتبر وارد کنید.");return}

    if(editingFxId){
      const item=fxTransactions.find(x=>x.id===editingFxId);
      if(item){item.date=date;item.currency=currency;item.amount=amount;item.bank=bank;item.description=description}
    }else{
      fxTransactions.unshift({id:"fx_"+Date.now().toString()+Math.random().toString(16).slice(2),
        date,currency,amount,bank,description,createdAt:new Date().toISOString()});
    }
    saveAll();resetFxForm();render();
  }

  function resetFxForm(){
    editingFxId=null;$("fxFormTitle").textContent="ثبت هزینه ارزی";fxSaveBtn.textContent="ثبت هزینه ارزی";
    fxCancelEditBtn.classList.add("hidden");fxDateInput.value=todayJalali();fxCurrencyInput.value="USD";
    fxAmountInput.value="";fxBankInput.value="";fxDescriptionInput.value="";
  }

  function editFx(id){
    const item=fxTransactions.find(x=>x.id===id);if(!item)return;
    editingFxId=id;fxDateInput.value=item.date||todayJalali();fxCurrencyInput.value=item.currency||"USD";
    fxAmountInput.value=item.amount;fxBankInput.value=item.bank||"";fxDescriptionInput.value=item.description||"";
    $("fxFormTitle").textContent="ویرایش هزینه ارزی";fxSaveBtn.textContent="ذخیره ویرایش";
    fxCancelEditBtn.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
  }

  function deleteRial(id){
    if(!confirm("این تراکنش حذف شود؟"))return;
    transactions=transactions.filter(x=>x.id!==id);saveAll();render();
  }

  function deleteFx(id){
    if(!confirm("این هزینه ارزی حذف شود؟"))return;
    fxTransactions=fxTransactions.filter(x=>x.id!==id);saveAll();render();
  }

  function startNewPeriod(){
    if(!confirm("دوره جدید از امروز شروع شود؟ هیچ تراکنشی حذف نمی‌شود.")) return;
    currentPeriodStart=todayJalali();
    showAllPeriods=false;
    saveAll();
    render();
  }

  function baseItemsForView(items){
    if(showAllPeriods || currentMode==="fx") return [...items];
    return items.filter(x=>dateKey(x.date)>=dateKey(currentPeriodStart));
  }

  function applyFilters(items){
    const q=bankSearchInput.value.trim().toLowerCase(),from=dateFromInput.value.trim(),to=dateToInput.value.trim();
    let out=items.filter(item=>{
      const bank=String(item.bank||"").toLowerCase();
      if(q&&!bank.includes(q))return false;
      const dk=dateKey(item.date);
      if(from&&isValidJalaliDate(from)&&dk<dateKey(from))return false;
      if(to&&isValidJalaliDate(to)&&dk>dateKey(to))return false;
      return true;
    });
    out.sort((a,b)=>sortOrderInput.value==="oldest"?dateKey(a.date)-dateKey(b.date):dateKey(b.date)-dateKey(a.date));
    return out;
  }

  function hasActiveFilter(){
    return !!(bankSearchInput.value.trim() || dateFromInput.value.trim() || dateToInput.value.trim());
  }

  function render(){
    const rialBase=baseItemsForView(transactions);
    const rialTotal=rialBase.reduce((s,x)=>s+Number(x.amount||0),0);
    $("total").textContent=formatNumber(rialTotal);
    $("totalLabel").textContent=showAllPeriods?"جمع کل همه دوره‌ها":"جمع کل دوره جاری";
    $("periodInfo").textContent=showAllPeriods?"همه دوره‌ها":`از ${currentPeriodStart}`;
    $("showAllBtn").classList.toggle("hidden",showAllPeriods);
    $("showCurrentBtn").classList.toggle("hidden",!showAllPeriods);

    const fxTotals={USD:0,AED:0,EUR:0};
    fxTransactions.forEach(x=>fxTotals[x.currency]=(fxTotals[x.currency]||0)+Number(x.amount||0));
    $("usdTotal").textContent=formatNumber(fxTotals.USD);
    $("aedTotal").textContent=formatNumber(fxTotals.AED);
    $("eurTotal").textContent=formatNumber(fxTotals.EUR);

    const source=currentMode==="rial"?baseItemsForView(transactions):[...fxTransactions];
    const items=applyFilters(source);
    $("count").textContent=`${items.length} مورد`;
    $("listTitle").textContent=currentMode==="rial"?"تراکنش‌ها":"هزینه‌های ارزی";

    if(currentMode==="rial"){
      filteredTotalEl.textContent=formatNumber(items.reduce((s,x)=>s+Number(x.amount||0),0));
    }else{
      const ft={USD:0,AED:0,EUR:0};
      items.forEach(x=>ft[x.currency]=(ft[x.currency]||0)+Number(x.amount||0));
      filteredTotalEl.textContent=`USD ${formatNumber(ft.USD)} | AED ${formatNumber(ft.AED)} | EUR ${formatNumber(ft.EUR)}`;
    }

    if(!items.length){$("list").innerHTML='<div class="empty">موردی پیدا نشد.</div>';return}

    $("list").innerHTML=items.map(item=>currentMode==="rial"?`
      <article class="item">
        <div class="item-top"><strong>${escapeHtml(item.bank)}</strong><div class="amount">${formatNumber(item.amount)}</div></div>
        <div class="meta"><div>تاریخ: ${escapeHtml(item.date)}</div><div>شرح: ${escapeHtml(item.description||"—")}</div></div>
        <div class="row-actions">
          <button class="edit-btn" data-action="edit-rial" data-id="${item.id}">ویرایش</button>
          <button class="delete-btn" data-action="delete-rial" data-id="${item.id}">حذف</button>
        </div>
      </article>`:`
      <article class="item">
        <div class="item-top"><strong>${escapeHtml(item.bank||"—")}</strong><div class="amount fx-amount">${formatNumber(item.amount)} ${escapeHtml(item.currency)}</div></div>
        <div class="meta"><div>تاریخ: ${escapeHtml(item.date)}</div><div>شرح: ${escapeHtml(item.description||"—")}</div></div>
        <div class="row-actions">
          <button class="edit-btn" data-action="edit-fx" data-id="${item.id}">ویرایش</button>
          <button class="delete-btn" data-action="delete-fx" data-id="${item.id}">حذف</button>
        </div>
      </article>`).join("");
  }

  function switchMode(mode){
    currentMode=mode;$("tabRial").classList.toggle("active",mode==="rial");$("tabFx").classList.toggle("active",mode==="fx");
    $("rialFormCard").classList.toggle("hidden",mode!=="rial");$("fxFormCard").classList.toggle("hidden",mode!=="fx");
    $("rialSummary").classList.toggle("hidden",mode!=="rial");$("fxSummary").classList.toggle("hidden",mode!=="fx");
    bankSearchInput.placeholder=mode==="rial"?"جستجو بر اساس نام بانک یا کارت":"جستجو بر اساس کارت / بانک / حساب";
    render();
  }

  function csvEscape(v){return `"${String(v??"").replaceAll('"','""')}"`}

  function exportExcel(){
    let rialRows=[],fxRows=[];

    if(hasActiveFilter()){
      rialRows=applyFilters([...transactions]);
      fxRows=applyFilters([...fxTransactions]);
    }else{
      rialRows=[...transactions];
      fxRows=[...fxTransactions];
    }

    const rows=[
      ["نوع","تاریخ","کارت/بانک","مبلغ","ارز","شرح"],
      ...rialRows.map(x=>["اصلی",x.date,x.bank,Number(x.amount),"TOMAN",x.description||""]),
      ...fxRows.map(x=>["ارزی",x.date,x.bank||"",Number(x.amount),x.currency,x.description||""])
    ];

    const csv="\ufeff"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`hesab-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }

  function setupDateMask(el){
    el.addEventListener("input",()=>{
      let v=normalizeDigits(el.value).replace(/[^\d/]/g,"");
      if(!v.includes("/")){
        v=v.replace(/\D/g,"").slice(0,8);
        if(v.length>4)v=v.slice(0,4)+"/"+v.slice(4);
        if(v.length>7)v=v.slice(0,7)+"/"+v.slice(7);
      }
      el.value=v.slice(0,10);
    });
  }

  [dateInput,fxDateInput,dateFromInput,dateToInput].forEach(setupDateMask);

  amountInput.addEventListener("input",()=>{
    const n=normalizeDigits(amountInput.value).replace(/[^\d]/g,"");
    amountInput.value=n?Number(n).toLocaleString("en-US"):"";
  });

  saveBtn.addEventListener("click",addOrEditRial);
  cancelEditBtn.addEventListener("click",resetRialForm);
  fxSaveBtn.addEventListener("click",addOrEditFx);
  fxCancelEditBtn.addEventListener("click",resetFxForm);

  $("tabRial").addEventListener("click",()=>switchMode("rial"));
  $("tabFx").addEventListener("click",()=>switchMode("fx"));

  $("newPeriodBtn").addEventListener("click",startNewPeriod);
  $("showAllBtn").addEventListener("click",()=>{showAllPeriods=true;render()});
  $("showCurrentBtn").addEventListener("click",()=>{showAllPeriods=false;render()});

  [bankSearchInput,dateFromInput,dateToInput,sortOrderInput].forEach(el=>{
    el.addEventListener(el.tagName==="SELECT"?"change":"input",render);
  });

  $("clearFiltersBtn").addEventListener("click",()=>{
    bankSearchInput.value="";dateFromInput.value="";dateToInput.value="";sortOrderInput.value="newest";render();
  });

  $("list").addEventListener("click",e=>{
    const b=e.target.closest("button[data-action]");if(!b)return;
    const id=b.dataset.id;
    if(b.dataset.action==="edit-rial")editRial(id);
    if(b.dataset.action==="delete-rial")deleteRial(id);
    if(b.dataset.action==="edit-fx")editFx(id);
    if(b.dataset.action==="delete-fx")deleteFx(id);
  });

  $("exportBtn").addEventListener("click",exportExcel);

  dateInput.value=todayJalali();fxDateInput.value=todayJalali();
  loadAll();render();
</script>
</body>
</html>
